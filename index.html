<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Integrador III - Manômetro para Pneus</title>
    <!-- Estilo minimalista e elegante para o seu Markdown -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        @media (max-width: 767px) {
            body { padding: 15px; }
        }
    </style>
</head>
<body class="markdown-body">
    <div id="content">Carregando documentação...</div>

    <!-- Script que converte seu README.md automaticamente em HTML de site -->
    <script src="https://jsdelivr.net"></script>
    <script>
        fetch('README.md')
            .then(response => {
                if (!response.ok) throw new Error('Erro ao carregar o arquivo README.md');
                return response.text();
            })
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `<p style="color:red">${err.message}</p>`;
            });
    </script>
</body>
</html>
