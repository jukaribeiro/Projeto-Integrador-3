<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Integrador III - Manômetro para Pneus</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        @media (max-width: 767px) {
            body { padding: 15px; }
        }
    </style>
</head>
<body class="markdown-body">
    <div id="content">Carregando documentação...</div>

    <script src="https://jsdelivr.net"></script>
    <script>
        // Tenta carregar o arquivo localmente
        fetch('README.md')
            .then(response => {
                if (!response.ok) {
                    // Se falhar (erro de maiúscula/minúscula no servidor), busca o link direto público
                    return fetch('https://githubusercontent.com');
                }
                return response.text();
            })
            .then(response => typeof response === 'string' ? response : response.text())
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `<p style="color:red">Erro ao carregar o conteúdo. Por favor, verifique o arquivo README.md.</p>`;
            });
    </script>
</body>
</html>
